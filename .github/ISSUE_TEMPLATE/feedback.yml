name: Feedback / 使用回饋 / フィードバック
description: Share an idea or report something that did not work. 中英日皆可。
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Lumen Stage. YuYing receives feedback here. Posts are public: do not attach private photographs or project files."
  - type: dropdown
    id: kind
    attributes:
      label: Type / 類型 / 種類
      options:
        - Suggestion / 功能建議 / 提案
        - Bug / 操作問題 / 不具合
        - General feedback / 使用感受 / 感想
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback / 你的回饋 / ご意見
      description: What happened, or what would you like to improve?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser / 裝置與瀏覽器 / 端末とブラウザ
      placeholder: e.g. iPhone Safari, Android Chrome, Mac Safari
